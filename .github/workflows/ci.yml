name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  static:
    name: typecheck, lint, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # M2-01: the CSP that lets Argon2's WASM instantiate under MV3 lives in the
      # GENERATED manifest, not in the config object the unit test can see. Build it
      # here so a change that drops it fails CI rather than a real browser.
      - run: bun run build:extension
      # Also checks the rules Chrome enforces at load time. An empty `matches` on a
      # content script makes the extension fail to load ENTIRELY, and nothing in the
      # build warns about it -- that cost one manual load failure already.
      - name: the built manifest is valid and loadable
        run: bun run scripts/check-manifest.ts
      # Blocking, so any NEW advisory fails the build. One exception, by id:
      # GHSA-67mh-4wv8-2f99 is esbuild's dev server letting any website read its
      # responses. As of the Vite 8 upgrade (2026-09-05) it reaches us through
      # drizzle-kit ALONE -- drizzle-kit > @esbuild-kit/core-utils > esbuild@0.18.20.
      # Vite now carries 0.25.12 and tsx 0.28.2, both past the 0.24.2 fix, so the
      # "or vite" half of this exception is retired. drizzle-kit is a CLI we run by
      # hand to generate migrations; it never starts a dev server and never ships.
      # Delete this flag entirely when drizzle-kit drops @esbuild-kit.
      #
      # Retried because it calls the npm advisory API, which returns 503 often enough
      # to have already failed a build. A registry outage is not a vulnerability, but
      # the step still fails if all three attempts get a real finding.
      - name: bun audit
        run: |
          for attempt in 1 2 3; do
            if bun audit --ignore=GHSA-67mh-4wv8-2f99; then exit 0; fi
            status=$?
            echo "audit attempt $attempt failed (exit $status)"
            sleep $((attempt * 10))
          done
          echo "bun audit failed three times"
          exit 1

  test-sqlite:
    name: tests (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      # DATABASE_URL deliberately unset: the Postgres suites must skip, not fail.
      - run: bun test
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-only-secret-not-used-in-production-32b' }}
      - run: bun run e2e
        env:
          JWT_SECRET: ci-only-secret-not-used-in-production-32b

  test-postgres:
    name: tests (postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cypherkey
          POSTGRES_PASSWORD: cypherkey
          POSTGRES_DB: cypherkey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cypherkey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cypherkey:cypherkey@localhost:5432/cypherkey
      JWT_SECRET: ci-only-secret-not-used-in-production-32b
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun test
      - run: bun run e2e

  size:
    name: A-15 size budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - name: measure and enforce
        id: sizes
        run: |
          bun run size-check | tee sizes.txt
      - name: post sizes to the run summary
        if: always()
        run: |
          {
            echo '### Size budgets (docs/02 A-15)'
            echo '```'
            cat sizes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: docker image builds and answers /healthz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cypherkey:ci .
      - name: report image size
        run: |
          SIZE=$(docker image inspect cypherkey:ci --format '{{.Size}}')
          echo "image: $((SIZE / 1024 / 1024)) MB"
          {
            echo '### Container image'
            echo "\`cypherkey:ci\` — $((SIZE / 1024 / 1024)) MB (A-15 budget: 130 MB)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt $((130 * 1024 * 1024)) ]; then
            echo "image exceeds the A-15 budget"; exit 1
          fi
      - name: start and probe
        run: |
          docker run -d --name ck -p 3000:3000 \
            -e JWT_SECRET=ci-only-secret-not-used-in-production-32b cypherkey:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then exit 0; fi
            sleep 1
          done
          echo "healthz never came up"; docker logs ck; exit 1
      - if: always()
        run: docker rm -f ck || true
