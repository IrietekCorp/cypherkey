# Cloud Run service definition for the CypherKey API (M2-16).
#
# Applied by .github/workflows/deploy.yml with `gcloud run services replace`. This file
# is the source of truth: a change made in the console is reverted by the next deploy.
# The image tag is the one placeholder, substituted with the commit SHA at deploy time.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cypherkey-api
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    # SERVICE level, not template level. `ingress` is a property of the service; put it
    # under `spec.template.metadata.annotations` next to minScale and Cloud Run accepts
    # the deploy, reports success, and silently ignores it -- which left the `*.run.app`
    # URL open while the config claimed otherwise.
    #
    # Only the load balancer may reach this service. That URL would otherwise be a
    # public bypass around Cloud Armor: the WAF and the per-IP throttle live on the
    # backend service, so anything talking to Cloud Run directly is unthrottled and
    # uninspected. api.cypherkey.io is the only door.
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        # gcp.md: Argon2id at m=64 MiB on a cold start looks broken, and a login is the
        # first thing anyone does. Keep one instance warm.
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '10'
        # Mounts the Cloud SQL unix socket at /cloudsql/<connection name>. Postgres is
        # reached over the network and is never part of the image (docs/07).
        run.googleapis.com/cloudsql-instances: <GCP_SQL_CONNECTION>
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: <GCP_RUNTIME_SA>
      # Each in-flight Argon2id hash holds 64 MiB. Cloud Run's default of 80 concurrent
      # requests per instance is how the memory limit gets hit; 20 against 1 GiB leaves
      # headroom. Start here and watch.
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: us-central1-docker.pkg.dev/<GCP_PROJECT_ID>/cypherkey/server:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 3000
          env:
            # postgres.js does NOT read the socket from a `?host=` query parameter. Its
            # parseOptions() takes the host from `url.hostname` only and forwards an
            # unrecognised `?host=` to the server as a startup parameter instead; it
            # also splits the host on ':', which a Cloud SQL connection name is full of.
            # So `postgres://user:pw@localhost/db?host=/cloudsql/...` silently dials TCP
            # localhost and fails. The URL therefore carries only the database name and
            # everything else arrives through the libpq-style PG* variables, which
            # postgres.js honours and which survive both slashes and colons intact.
            # Verified against node_modules/postgres/src/index.js (parseOptions, and
            # connection.js:350 `if (options.path) return socket.connect(options.path)`).
            - name: DATABASE_URL
              value: postgres:///cypherkey
            - name: PGHOST
              value: /cloudsql/<GCP_SQL_CONNECTION>
            - name: PGUSER
              value: cypherkey_app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: PGPASSWORD
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: latest
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          # The image is distroless with no shell, so a Docker HEALTHCHECK cannot work
          # and Cloud Run probes /healthz itself. That route returns 503 when the
          # database will not answer, so a passing startup probe also proves the Cloud
          # SQL socket is wired correctly — a misconfigured DATABASE_URL fails the
          # deploy here rather than on a user's first login.
          startupProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
